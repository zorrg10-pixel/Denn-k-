name: Build Kniznica Reader APK

on:
  push:
    branches: [ build-kniznica-reader-apk ]
    paths:
      - 'kniznica-reader/source/**'
      - '.github/workflows/kniznica-reader-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android project
        shell: bash
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE/kniznica-reader/android-app"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/app/src/main/java/sk/kniznica/reader" "$ROOT/app/src/main/assets"
          cat kniznica-reader/source/index.gzip.b64.* | base64 -d | gunzip > "$ROOT/app/src/main/assets/index.html"
          curl -fL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js -o "$ROOT/app/src/main/assets/pdf.min.js"
          curl -fL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js -o "$ROOT/app/src/main/assets/pdf.worker.min.js"

          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='KniznicaReader'
          include ':app'
          EOF

          cat > "$ROOT/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > "$ROOT/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'sk.kniznica.reader'
            compileSdk 35
            defaultConfig { applicationId 'sk.kniznica.reader'; minSdk 24; targetSdk 35; versionCode 2; versionName '1.1' }
          }
          EOF

          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Knižnica Reader" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > "$ROOT/app/src/main/java/sk/kniznica/reader/MainActivity.java" <<'EOF'
          package sk.kniznica.reader;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.view.View;
          import android.webkit.*;
          public class MainActivity extends Activity {
            private static final int PICK=7001;
            private WebView w;
            private ValueCallback<Uri[]> cb;
            @Override public void onCreate(Bundle b){
              super.onCreate(b);
              getWindow().setStatusBarColor(Color.rgb(238,58,100));
              getWindow().setNavigationBarColor(Color.WHITE);
              if(android.os.Build.VERSION.SDK_INT>=26)getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR);
              w=new WebView(this); setContentView(w);
              WebSettings s=w.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setSupportZoom(false); s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true);
              w.setWebViewClient(new WebViewClient());
              w.setWebChromeClient(new WebChromeClient(){@Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> c,FileChooserParams p){if(cb!=null)cb.onReceiveValue(null);cb=c;try{Intent i=p.createIntent();i.addCategory(Intent.CATEGORY_OPENABLE);startActivityForResult(i,PICK);return true;}catch(Exception e){cb=null;return false;}}});
              w.loadUrl("file:///android_asset/index.html");
            }
            @Override protected void onActivityResult(int r,int x,Intent d){super.onActivityResult(r,x,d);if(r==PICK&&cb!=null){cb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(x,d));cb=null;}}
            @Override public void onBackPressed(){String j="(function(){var p=document.getElementById('pdfReader');if(p&&p.classList.contains('show')){document.getElementById('closePdf').click();return 'h';}var r=document.getElementById('reader');if(r&&r.classList.contains('show')){document.getElementById('closeReader').click();return 'h';}var o=document.querySelector('.overlay.show');if(o){o.classList.remove('show');return 'h';}var d=document.getElementById('drawer');if(d&&d.classList.contains('show')){document.getElementById('drawerBackdrop').click();return 'h';}return 'f';})()";w.evaluateJavascript(j,v->{if(v!=null&&v.contains("h"))return;if(w.canGoBack())w.goBack();else finish();});}
          }
          EOF

      - name: Build APK
        working-directory: kniznica-reader/android-app
        run: gradle --no-daemon assembleDebug

      - name: Verify and rename APK
        shell: bash
        run: |
          APK=kniznica-reader/android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" Kniznica-Reader-v1.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kniznica-Reader-v1.1
          path: Kniznica-Reader-v1.1.apk
          if-no-files-found: error
